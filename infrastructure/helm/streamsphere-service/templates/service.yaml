apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "ss.labels" . | nindent 4 }}
spec:
  selector: { app.kubernetes.io/name: {{ .Values.name }} }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "ss.labels" . | nindent 4 }}
automountServiceAccountToken: {{ .Values.jobLauncher.enabled }}
