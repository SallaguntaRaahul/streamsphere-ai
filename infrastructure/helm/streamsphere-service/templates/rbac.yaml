{{- if .Values.jobLauncher.enabled }}
# Least privilege: the media service may only create/read/delete Jobs in its own namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: { name: {{ .Values.name }}-job-launcher }
rules:
  - apiGroups: [batch]
    resources: [jobs]
    verbs: [create, get, list, watch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: { name: {{ .Values.name }}-job-launcher }
subjects: [{ kind: ServiceAccount, name: {{ .Values.name }} }]
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Values.name }}-job-launcher }
{{- end }}
