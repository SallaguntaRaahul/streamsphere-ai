{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.name }}
  labels:
    {{- include "ss.labels" . | nindent 4 }}
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: {{ .Values.name }} } }
  policyTypes: [Ingress]
  ingress:
    - from:
        {{- range .Values.networkPolicy.allowFrom }}
        - podSelector: { matchLabels: { app.kubernetes.io/name: {{ . }} } }
        {{- end }}
        - podSelector: { matchLabels: { app.kubernetes.io/name: prometheus } }
        {{- if .Values.networkPolicy.allowFromIngress }}
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
        {{- end }}
      ports: [{ port: http }]
{{- end }}
