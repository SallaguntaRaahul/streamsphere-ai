server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy strict-origin-when-cross-origin always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  location = /config.js { alias /tmp/streamsphere-config.js; default_type application/javascript; add_header Cache-Control "no-store"; }
  location ~* \.(?:js|css|woff2?|svg|png|jpg)$ { expires 1y; add_header Cache-Control "public, immutable"; try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
