[project]
name = "streamsphere-recommendations"
version = "0.1.0"
description = "StreamSphere recommendations + embeddings (FastAPI)"
authors = [{ name = "Raahul Sallagunta" }]
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.161.1",
  "uvicorn==0.54.0",
  "psycopg[binary,pool]==3.3.6",
  "pgvector==0.5.1",
  "numpy>=2.1,<3",
  "aio-pika==10.1.1",
  "pyjwt[crypto]>=2.10,<3",
  "prometheus-client>=0.21,<1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
model = ["fastembed==0.9.0"]
test = ["pytest>=8,<10"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# explicit packages: migrations/ and tests/ are data/test dirs, not importable packages
packages = ["app", "eval"]
