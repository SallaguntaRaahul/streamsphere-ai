global: { scrape_interval: 15s, evaluation_interval: 15s }
rule_files: [/etc/prometheus/alerts/*.yml]
scrape_configs:
  - job_name: streamsphere
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: [gateway:8080, profile:8080, catalog:8080, creator:8080, upload:8080, media:8080, playback:8080,
                  history:8080, search:8080, moderation:8080, analytics:8080, notifications:8080, recommendations:8080]
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+):.*'
        target_label: service
  - job_name: rabbitmq
    static_configs: [{ targets: ['rabbitmq:15692'] }]
