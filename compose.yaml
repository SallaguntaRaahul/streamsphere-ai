    environment:
      <<: *java-env
      SERVER_PORT: "8080"
      CATALOG_URL: http://catalog:8080
      CREATOR_URL: http://creator:8080
      PROFILE_URL: http://profile:8080
      UPLOAD_URL: http://upload:8080
      MEDIA_URL: http://media:8080
      PLAYBACK_URL: http://playback:8080
      HISTORY_URL: http://history:8080
      SEARCH_URL: http://search:8080
      RECOMMENDATIONS_URL: http://recommendations:8080
      MODERATION_URL: http://moderation:8080
      ANALYTICS_URL: http://analytics:8080
      NOTIFICATIONS_URL: http://notifications:8080

  upload:
    <<: *java
    image: ${IMAGE_PREFIX:-streamsphere}/${IMAGE_NAME_PREFIX:-}upload:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infrastructure/docker/java-service.Dockerfile
      target: ${JAVA_IMAGE_TARGET:-runtime-prebuilt}
      args: { MODULE: services/upload }
    environment:
      <<: *java-env
      SERVER_PORT: "8080"
      CATALOG_URL: http://catalog:8080
      CREATOR_URL: http://creator:8080
      PROFILE_URL: http://profile:8080
      UPLOAD_URL: http://upload:8080
      MEDIA_URL: http://media:8080
      PLAYBACK_URL: http://playback:8080
      HISTORY_URL: http://history:8080
      SEARCH_URL: http://search:8080
      RECOMMENDATIONS_URL: http://recommendations:8080
      MODERATION_URL: http://moderation:8080
      ANALYTICS_URL: http://analytics:8080
      NOTIFICATIONS_URL: http://notifications:8080
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      STORAGE_QUOTA_BYTES: ${STORAGE_QUOTA_BYTES}
      COST_GUARD_STOP_RATIO: ${COST_GUARD_STOP_RATIO}
      TUS_HOOK_SECRET: ${TUS_HOOK_SECRET}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES}

  media:
    <<: *java
    image: ${IMAGE_PREFIX:-streamsphere}/${IMAGE_NAME_PREFIX:-}media:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infrastructure/docker/java-service.Dockerfile
      target: ${JAVA_IMAGE_TARGET:-runtime-prebuilt}
      args: { MODULE: services/media }
    environment:
      <<: *java-env
      SERVER_PORT: "8080"
      CATALOG_URL: http://catalog:8080
      CREATOR_URL: http://creator:8080
      PROFILE_URL: http://profile:8080
      UPLOAD_URL: http://upload:8080
      MEDIA_URL: http://media:8080
      PLAYBACK_URL: http://playback:8080
      HISTORY_URL: http://history:8080
      SEARCH_URL: http://search:8080
      RECOMMENDATIONS_URL: http://recommendations:8080
      MODERATION_URL: http://moderation:8080
      ANALYTICS_URL: http://analytics:8080
      NOTIFICATIONS_URL: http://notifications:8080
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      TRANSCODE_LAUNCHER: queue

  playback:
    <<: *java
    image: ${IMAGE_PREFIX:-streamsphere}/${IMAGE_NAME_PREFIX:-}playback:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infrastructure/docker/java-service.Dockerfile
      target: ${JAVA_IMAGE_TARGET:-runtime-prebuilt}
      args: { MODULE: services/playback }
    environment:
      <<: *java-env
      SERVER_PORT: "8080"
      CATALOG_URL: http://catalog:8080
      CREATOR_URL: http://creator:8080
      PROFILE_URL: http://profile:8080
      UPLOAD_URL: http://upload:8080
      MEDIA_URL: http://media:8080
      PLAYBACK_URL: http://playback:8080
      HISTORY_URL: http://history:8080
      SEARCH_URL: http://search:8080
      RECOMMENDATIONS_URL: http://recommendations:8080
      MODERATION_URL: http://moderation:8080
      ANALYTICS_URL: http://analytics:8080
      NOTIFICATIONS_URL: http://notifications:8080
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_PUBLIC_ENDPOINT: http://localhost:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      PLAYBACK_TOKEN_SECRET: ${PLAYBACK_TOKEN_SECRET}

  recommendations:
    image: ${IMAGE_PREFIX:-streamsphere}/${IMAGE_NAME_PREFIX:-}recommendations:${IMAGE_TAG:-local}
    build: { context: services/recommendations }
    environment:
      DB_DSN: postgresql://recommendations_svc:recommendations_local_pw@postgres:5432/recommendations
      RABBIT_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      JWT_ISSUER: http://localhost:8180/realms/streamsphere
      JWKS_URI: http://keycloak:8080/realms/streamsphere/protocol/openid-connect/certs
      USER_HASH_SALT: ${ANALYTICS_USER_HASH_SALT:-local-dev-salt-change-me}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      keycloak: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/actuator/health/readiness')"]
      interval: 10s
      retries: 30
      start_period: 20s
    read_only: true
    tmpfs: [/tmp]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    restart: unless-stopped

  web:
    image: ${IMAGE_PREFIX:-streamsphere}/${IMAGE_NAME_PREFIX:-}web:${IMAGE_TAG:-local}
    build: { context: apps/web-angular }
    environment:
      API_BASE: ${PUBLIC_API_BASE:-http://localhost:8080}
      OIDC_AUTHORITY: ${PUBLIC_OIDC_AUTHORITY:-http://localhost:8180/realms/streamsphere}
    ports: ["127.0.0.1:4200:8080"]
    read_only: true
    tmpfs: ["/tmp", "/var/cache/nginx"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/config.js"]
      interval: 10s
    mem_limit: 64m
    restart: unless-stopped

  ffmpeg-worker:
    image: ${IMAGE_PREFIX:-streamsphere}/${IMAGE_NAME_PREFIX:-}ffmpeg-worker:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infrastructure/docker/ffmpeg-worker.Dockerfile
      target: ${JAVA_IMAGE_TARGET:-runtime-prebuilt}
    command: ["--mode=consumer"]
    environment:
      SPRING_RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: ${MINIO_ROOT_USER}
      STORAGE_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      FAULT_INJECTION: ${FFMPEG_FAULT_INJECTION:-}
    depends_on:
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
    read_only: true
    tmpfs: ["/tmp", "/work:size=4g,uid=10001,gid=10001"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: [ALL]
    cpus: 2.0
    mem_limit: 1536m
    restart: unless-stopped

  tusd:
    # tus resumable-upload protocol server (UploadProvider "tus"). Stores straight into the private uploads
    # bucket; admission + verification happen in the upload service via HTTP hooks.
    profiles: [full]
    image: tusproject/tusd:v2.10.1
    command: ["-s3-bucket=streamsphere-uploads", "-s3-endpoint=http://minio:9000", "-s3-object-prefix=tus/",
              "-base-path=/files/", "-behind-proxy",
              "-hooks-http=http://upload:8080/api/v1/internal/tus/hooks?secret=${TUS_HOOK_SECRET}",
              "-hooks-enabled-events=pre-create,post-finish", "-hooks-http-forward-headers=Authorization",
              "-cors-allow-origin=^http://(localhost|127\\.0\\.0\\.1):4200$"]
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
    ports: ["127.0.0.1:1080:8080"]
    depends_on: { minio: { condition: service_healthy } }
    read_only: true
    tmpfs: ["/tmp:size=256m"]   # tusd buffers S3 parts here
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m

  # ---------------------------------------------------------------- local-full profile
  otel-collector:
    profiles: [full]
    image: otel/opentelemetry-collector-contrib:0.138.0
    command: ["--config=/etc/otel/collector.yaml"]
    volumes: [./observability/otel/collector.yaml:/etc/otel/collector.yaml:ro]
    mem_limit: 256m
  tempo:
    profiles: [full]
    image: grafana/tempo:2.6.1@sha256:ef4384fce6e8ad22b95b243d8fc165628cda655376fd50e7850536ad89d71d50
    command: ["-config.file=/etc/tempo.yaml"]
    volumes: [./observability/otel/tempo.yaml:/etc/tempo.yaml:ro]
    mem_limit: 384m
  loki:
    profiles: [full]
    image: grafana/loki:3.5.7
    command: ["-config.file=/etc/loki/local-config.yaml"]
    mem_limit: 384m
