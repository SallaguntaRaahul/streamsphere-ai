      PROFILE_URL: http://profile:8080
      UPLOAD_URL: http://upload:8080
      MEDIA_URL: http://media:8080
      PLAYBACK_URL: http://playback:8080
      HISTORY_URL: http://history:8080
      SEARCH_URL: http://search:8080
      RECOMMENDATIONS_URL: http://recommendations:8080
      MODERATION_URL: http://moderation:8080
      ANALYTICS_URL: http://analytics:8080
      NOTIFICATIONS_URL: http://notifications:8080

  history:
    <<: *java
    image: ${IMAGE_PREFIX:-streamsphere}/${IMAGE_NAME_PREFIX:-}history:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infrastructure/docker/java-service.Dockerfile
      target: ${JAVA_IMAGE_TARGET:-runtime-prebuilt}
