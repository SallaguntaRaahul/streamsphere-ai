      target: ${JAVA_IMAGE_TARGET:-runtime-prebuilt}
      args: { MODULE: services/moderation }
    environment:
      <<: *java-env
      SERVER_PORT: "8080"
      CATALOG_URL: http://catalog:8080
      CREATOR_URL: http://creator:8080
      PROFILE_URL: http://profile:8080
      UPLOAD_URL: http://upload:8080
      MEDIA_URL: http://media:8080
      PLAYBACK_URL: http://playback:8080
      HISTORY_URL: http://history:8080
      SEARCH_URL: http://search:8080
      RECOMMENDATIONS_URL: http://recommendations:8080
      MODERATION_URL: http://moderation:8080
      ANALYTICS_URL: http://analytics:8080
      NOTIFICATIONS_URL: http://notifications:8080

  analytics:
    <<: *java
    image: ${IMAGE_PREFIX:-streamsphere}/${IMAGE_NAME_PREFIX:-}analytics:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infrastructure/docker/java-service.Dockerfile
      target: ${JAVA_IMAGE_TARGET:-runtime-prebuilt}
      args: { MODULE: services/analytics }
    environment:
      <<: *java-env
      SERVER_PORT: "8080"
      CATALOG_URL: http://catalog:8080
      CREATOR_URL: http://creator:8080
      PROFILE_URL: http://profile:8080
      UPLOAD_URL: http://upload:8080
      MEDIA_URL: http://media:8080
      PLAYBACK_URL: http://playback:8080
      HISTORY_URL: http://history:8080
      SEARCH_URL: http://search:8080
      RECOMMENDATIONS_URL: http://recommendations:8080
      MODERATION_URL: http://moderation:8080
      ANALYTICS_URL: http://analytics:8080
      NOTIFICATIONS_URL: http://notifications:8080
      ANALYTICS_USER_HASH_SALT: ${ANALYTICS_USER_HASH_SALT:-local-dev-salt-change-me}
      ANALYTICS_KAFKA_ENABLED: ${ANALYTICS_KAFKA_ENABLED:-false}   # true with --profile full
      KAFKA_BOOTSTRAP: kafka:9092

  notifications:
    <<: *java
    image: ${IMAGE_PREFIX:-streamsphere}/${IMAGE_NAME_PREFIX:-}notifications:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infrastructure/docker/java-service.Dockerfile
      target: ${JAVA_IMAGE_TARGET:-runtime-prebuilt}
      args: { MODULE: services/notifications }
    environment:
      <<: *java-env
      SERVER_PORT: "8080"
      CATALOG_URL: http://catalog:8080
      CREATOR_URL: http://creator:8080
      PROFILE_URL: http://profile:8080
      UPLOAD_URL: http://upload:8080
      MEDIA_URL: http://media:8080
      PLAYBACK_URL: http://playback:8080
      HISTORY_URL: http://history:8080
      SEARCH_URL: http://search:8080
      RECOMMENDATIONS_URL: http://recommendations:8080
      MODERATION_URL: http://moderation:8080
      ANALYTICS_URL: http://analytics:8080
      NOTIFICATIONS_URL: http://notifications:8080

  search:
    <<: *java
    image: ${IMAGE_PREFIX:-streamsphere}/${IMAGE_NAME_PREFIX:-}search:${IMAGE_TAG:-local}
    build:
      context: .
      dockerfile: infrastructure/docker/java-service.Dockerfile
      target: ${JAVA_IMAGE_TARGET:-runtime-prebuilt}
